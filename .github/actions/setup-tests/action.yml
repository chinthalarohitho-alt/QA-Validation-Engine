name: Setup test environment
description: Node from .nvmrc with the npm cache, dependencies, and a cached Playwright browser.

inputs:
  install-browsers:
    description: Install Playwright browsers. Set false for jobs that never open one.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        # The Node version lives in .nvmrc and nowhere else, so local and CI cannot drift.
        node-version-file: .nvmrc
        cache: npm

    - shell: bash
      run: npm ci

    - id: pw-version
      if: inputs.install-browsers == 'true'
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - id: pw-cache
      if: inputs.install-browsers == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

    - if: inputs.install-browsers == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    # The cache holds the browser but not the OS libraries it links against. Skipping this on a
    # cache hit is the classic mistake: the job looks cached, then every test dies with
    # "browser closed unexpectedly".
    - if: inputs.install-browsers == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
